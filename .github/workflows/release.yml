name: Prepare release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Package integration
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path('custom_components/ukho_tides')
          version = json.loads((root / 'manifest.json').read_text())['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Expected a three-part release version')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'VERSION={version}\n')
          with ZipFile('hlm-ukho-tides.zip', 'w', ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and '__pycache__' not in path.parts:
                      archive.write(path, path.as_posix())
          PY
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" hlm-ukho-tides.zip \
            --target "$GITHUB_SHA" --draft \
            --title "HLM UKHO Tides ${VERSION}" --notes-file CHANGELOG.md
